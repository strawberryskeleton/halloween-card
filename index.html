<!DOCTYPE html>
<html lang="en">
<head>

    <title>Happy Halloween</title>
    <link rel="shortcut icon" href="./assets/ghost2.png" type="image/x-icon">

        <div class="text">

        </div> -->

        </div>

        <div class="theme-menu">
            <div id="ghost"></div>

        </div>
    </div>
